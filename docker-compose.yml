services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nurtured_choice_sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nurtured_choice_sales"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./backend
    environment:
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=nurtured_choice_sales;Username=postgres;Password=${POSTGRES_PASSWORD}
      ASPNETCORE_URLS: http://+:10000
    depends_on:
      database:
        condition: service_healthy
    ports: ["10000:10000"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:10000}
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  postgres-data:
