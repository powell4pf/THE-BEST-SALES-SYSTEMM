server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Allow the same-origin barcode scanner to request the device camera.
  # Microphone and location remain disabled for this sales application.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  location / { try_files $uri $uri/ /index.html; }
  location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location ~* \.(?:js|mjs|css|map|woff2?|png|jpg|jpeg|gif|svg|webp)$ { try_files $uri =404; }
  location = /service-worker.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
}
